[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yota-tariff-parser"
version = "1.0.0"
description = "Поиск безлимитных архивных тарифов Yota с остатком"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["curl_cffi==0.16.3"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
browser = ["playwright==1.63.0"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
yota-parser = "yota_parser.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
