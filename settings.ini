[parser]
; Максимум запросов в секунду, включая повторные попытки.
requests_per_second = 10
; Максимум одновременных запросов.
parallel_requests = 3
connect_timeout_seconds = 5
timeout_seconds = 25
network_retries = 2
; Количество самых дешёвых уникальных тарифов в top_tariffs.txt.
top_count = 25
mode = api
browser_delay_seconds = 1
output = results/tariffs.txt
